<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1eb" />
    <meta name="description" content="Visualização da poltrona KARV em realidade aumentada." />
    <title>KARV — Ver no meu ambiente</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script type="module" src="./ar.js"></script>
  </head>
  <body>
    <main class="experience" aria-labelledby="page-title">
      <header class="topbar">
        <a class="brand" href="../" aria-label="KARV">
          <span class="brand-mark">K</span>
          <span>KARV</span>
        </a>
        <span id="statusPill" class="status-pill" role="status">Carregando 3D</span>
      </header>

      <section class="viewer-stage" aria-label="Visualização 3D da poltrona KARV">
        <model-viewer
          id="karvViewer"
          src="../base/base.glb"
          alt="Poltrona KARV em visualização tridimensional"
          camera-controls
          disable-zoom
          touch-action="pan-y"
          interaction-prompt="auto"
          environment-image="neutral"
          exposure="1.08"
          shadow-intensity="0.85"
          shadow-softness="0.9"
          camera-orbit="40deg 72deg 1.8m"
          ar
          ar-modes="webxr quick-look"
          ar-placement="floor"
          ar-scale="fixed"
          xr-environment
        >
          <button id="arButton" class="ar-button" slot="ar-button" type="button">
            <span class="ar-icon" aria-hidden="true">⌗</span>
            Ver no meu ambiente
          </button>

          <div id="loadingPanel" class="loading-panel" slot="poster" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            Preparando a poltrona KARV
          </div>
        </model-viewer>

        <div class="product-copy">
          <p class="eyebrow">KARV PERSONALIZE · AR MVP</p>
          <h1 id="page-title">Veja a KARV no seu espaço.</h1>
          <p class="description">Posicione a poltrona no piso em escala real e avalie volume, proporção e presença no ambiente.</p>
          <dl class="specs" aria-label="Dimensões aproximadas">
            <div><dt>Largura</dt><dd>82 cm</dd></div>
            <div><dt>Altura</dt><dd>74 cm</dd></div>
            <div><dt>Profundidade</dt><dd>76 cm</dd></div>
          </dl>
          <p id="deviceHelp" class="device-help" hidden></p>
        </div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2d30" />
    <meta name="description" content="Configurador 3D e realidade aumentada da poltrona KARV." />
    <title>KARV — Configurador 3D</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./viewport.css" />
    <link rel="stylesheet" href="./viewport-layout-fix.css" />
    <link rel="stylesheet" href="./studio-premium.css" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script type="module" src="./viewport-controls.js"></script>
    <script type="module" src="./lat-top-texture-calibration.js"></script>
    <script type="module" src="./configurator.js"></script>
  </head>
  <body>
    <main class="experience" aria-labelledby="page-title">
      <header class="topbar">
        <a class="brand" href="../" aria-label="KARV"><span class="brand-mark">K</span><span>KARV</span></a>
        <div class="topbar-center" aria-hidden="true">
          <span class="document-name">KARV 3D</span>
          <span class="document-separator">/</span>
          <span>Material Viewport</span>
        </div>
        <span id="statusPill" class="status-pill" role="status">Carregando 3D</span>
      </header>

      <section class="workspace">
        <section class="viewport-shell" aria-label="Área gráfica 3D">
          <div id="viewportStage" class="viewport-stage">
            <div class="viewport-toolbar" aria-label="Controles da vista 3D">
              <div class="viewport-toolbar-group">
                <span id="viewLabel" class="viewport-readout">Perspectiva</span>
                <button class="viewport-tool" type="button" data-view="perspective" aria-pressed="true">Perspectiva</button>
                <button class="viewport-tool" type="button" data-view="front" aria-pressed="false">Frontal</button>
                <button class="viewport-tool" type="button" data-view="right" aria-pressed="false">Direita</button>
                <button class="viewport-tool" type="button" data-view="back" aria-pressed="false">Traseira</button>
                <button class="viewport-tool" type="button" data-view="left" aria-pressed="false">Esquerda</button>
              </div>
              <div class="viewport-toolbar-group">
                <button id="gridToggle" class="viewport-toggle" type="button" aria-pressed="true">Grade</button>
                <button id="fullscreenToggle" class="viewport-toggle" type="button" aria-pressed="false">Tela cheia</button>
              </div>
            </div>

            <model-viewer id="karvViewer" src="../base/base.v1.fe8f015c.glb" alt="Poltrona KARV configurável em três dimensões" camera-controls disable-pan touch-action="pan-y" interaction-prompt="auto" environment-image="neutral" exposure="1.08" shadow-intensity="0.85" shadow-softness="0.9" camera-target="auto auto auto" camera-orbit="35deg 72deg 2.65m" min-camera-orbit="auto 52deg 2.15m" max-camera-orbit="auto 86deg 3.10m" field-of-view="32deg" min-field-of-view="29deg" max-field-of-view="36deg" ar ar-modes="webxr quick-look" ar-placement="floor" ar-scale="fixed" xr-environment>
              <button class="ar-button" slot="ar-button" type="button"><span aria-hidden="true">⌗</span>Ver no ambiente</button>
              <div class="loading-panel" slot="poster" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Preparando a poltrona KARV</div>
            </model-viewer>

            <div class="viewport-axis" aria-hidden="true">
              <span class="axis-x">X</span>
              <span class="axis-y">Y</span>
              <span class="axis-z">Z</span>
            </div>

            <div class="viewer-footer">
              <div><span class="label">Área selecionada</span><strong id="selectedFace">Aguardando o modelo</strong></div>
              <button id="applyAllButton" class="secondary-button" type="button" disabled>Aplicar em todas</button>
            </div>
          </div>
        </section>

        <aside class="inspector-panel" aria-label="Biblioteca e propriedades do material">
          <header class="inspector-header">
            <p class="inspector-kicker">Material Properties</p>
            <h1 id="page-title">Biblioteca KARV</h1>
            <p class="inspector-description">Selecione uma face no viewport e aplique o tecido. <strong id="catalogSummary">Carregando catálogo.</strong></p>
          </header>
          <div class="inspector-scroll">
            <label class="filter-label" for="collectionFilter">Coleção</label>
            <select id="collectionFilter" class="collection-filter" disabled><option>Carregando catálogo</option></select>
            <div id="catalogNotice" class="catalog-notice" role="note">Preparando as informações da coleção.</div>
            <div id="fabricGrid" class="fabric-grid" aria-live="polite"></div>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>

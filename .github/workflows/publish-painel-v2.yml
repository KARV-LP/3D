name: Publish painel v2

on:
  push:
    branches:
      - feat/painel-tecidos-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact rebased patch result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/painel-tecidos
          git checkout origin/feat/painel-tecidos -- app/configurator.js app/index.html app/styles.css app/viewport.css
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/configurator.js')
          s = p.read_text()
          old = """// Calibração inicial por peça. Os valores serão refinados após validação visual na poltrona oficial.
          const LIBRARY_TEXTURE_TRANSFORMS = new Map([
            ['assento', { scale: { u: 2.15, v: 2.15 }, rotation: 0 }],
            ['encosto-frt', { scale: { u: 2.05, v: 2.05 }, rotation: 0 }],
            ['encosto lat', { scale: { u: 2.3, v: 2.3 }, rotation: Math.PI / 2 }],
            ['encosto traseiro', { scale: { u: 2.05, v: 2.05 }, rotation: 0 }],
            ['lat ext', { scale: { u: 2.45, v: 2.45 }, rotation: Math.PI / 2 }],
            ['lat int', { scale: { u: 2.45, v: 2.45 }, rotation: Math.PI / 2 }],
            ['lat rr', { scale: { u: 2.25, v: 2.25 }, rotation: 0 }],
            ['Material.012', { scale: { u: 2.35, v: 2.35 }, rotation: Math.PI / 2 }],
          ]);"""
          new = """// Calibração inicial por peça. Os valores serão refinados após validação visual na poltrona oficial.
          // Escala fisicamente derivada: 1 tile = 120x60 cm (physical_reference_cm).
          const LIBRARY_TEXTURE_TRANSFORMS = new Map([
            ['assento', { scale: { u: 0.937, v: 0.937 }, rotation: 0 }],
            ['encosto-frt', { scale: { u: 0.690, v: 0.690 }, rotation: 0 }],
            ['encosto lat', { scale: { u: 0.536, v: 0.536 }, rotation: Math.PI / 2 }],
            ['encosto traseiro', { scale: { u: 0.961, v: 0.961 }, rotation: 0 }],
            ['lat ext', { scale: { u: 1.059, v: 1.059 }, rotation: Math.PI / 2 }],
            ['lat int', { scale: { u: 0.860, v: 0.860 }, rotation: Math.PI / 2 }],
            ['lat rr', { scale: { u: 0.305, v: 0.305 }, rotation: 0 }],
            ['Material.012', { scale: { u: 1.608, v: 1.608 }, rotation: Math.PI / 2 }],
          ]);"""
          if old not in s:
              raise SystemExit('transform block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/index.html')
          s = p.read_text()
          old_model = '../base/base.v1.fe8f015c.glb'
          new_model = '../base/base.v3.0adba33a.glb'
          if s.count(old_model) != 1:
              raise SystemExit('old model reference mismatch')
          p.write_text(s.replace(old_model, new_model, 1))
          PY
      - name: Verify exact file hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/configurator.js)" = "abc098d3f6657dbdd4c75dacafdedcfbc916db05"
          test "$(git hash-object app/index.html)" = "6002db305558d26e7b5cbf2414390664dff4f9f7"
          test "$(git hash-object app/styles.css)" = "d84f909ebcc46ea387cc654bba20d1e207c19b67"
          test "$(git hash-object app/viewport.css)" = "69b8e97f471460766a9958d45db51b19d91c066a"
          test "$(git diff HEAD --name-only -- app | wc -l)" -eq 4
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app/configurator.js
          npm ci || npm install
          npm test
          npm run build
      - name: Commit exact result and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-painel-v2.yml
          git config user.name "KARV GPT Executor"
          git config user.email "actions@users.noreply.github.com"
          git add app/configurator.js app/index.html app/styles.css app/viewport.css .github/workflows/publish-painel-v2.yml
          git commit -m "feat(app): painel de tecidos (metadados, filtros, resumo, aplicar-na-peca)"
          git push origin HEAD:feat/painel-tecidos-v2

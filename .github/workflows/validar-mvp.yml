name: Validar KARV 3D MVP

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Guard de nomes proibidos (fornecedor)
        run: npm run guard
      - name: Validar modelo, catálogo e runtime
        run: npm test
      - name: Gerar build estático
        run: npm run build

name: Validar AR MVP

on:
  pull_request:
    branches:
      - agent/estrutura-configurador
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar modelo e AR
        run: npm test
      - name: Gerar build estatico
        run: npm run build
